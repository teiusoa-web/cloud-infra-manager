services:
  backend:
    build:
      context: ./backend
    container_name: cloud-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./infra:/infra
      - ~/.config/gcloud:/root/.config/gcloud
    restart: unless-stopped
    environment:
      - PULUMI_CONFIG_PASSPHRASE=123456

  frontend:
    build:
      context: ./frontend
    container_name: cloud-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
