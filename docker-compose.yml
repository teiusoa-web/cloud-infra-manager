services:
  backend:
    build:
      context: ./backend
    container_name: cloud-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./infra:/infra
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cloud-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped